# 3DS: the Audio engine row's DSP mode (rt64-3ds dsp_synth.h). Each of
# n_audio's synthesizer entry points tells rt64-3ds what the game asked of
# it, which then plays the game's voices on DSP channels instead of running
# the audio task. DK64 has no plain n_alSynStartVoice. Inert on the desktop
# and while the engine is RSP.
[[patches.hook]]
func = "func_global_asm_8073CDD0"   # n_alSynStartVoiceParams (DK64's ten-argument one)
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 1); }
#endif
"""
[[patches.hook]]
func = "n_alSynStopVoice"   # stop voice
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 2); }
#endif
"""
[[patches.hook]]
func = "func_global_asm_8073B830"   # n_alSynSetVol
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 3); }
#endif
"""
[[patches.hook]]
func = "func_global_asm_8073B900"   # n_alSynSetPitch
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 4); }
#endif
"""
[[patches.hook]]
func = "func_global_asm_8073CF00"   # n_alSynSetPan
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 5); }
#endif
"""
[[patches.hook]]
func = "func_global_asm_8073C820"   # n_alSynSetFXMix
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 6); }
#endif
"""
[[patches.hook]]
func = "n_alAudioFrame"   # audio frame
text = """
#ifdef __3DS__
    { extern void recomp3ds_synth_hook(uint8_t*, void*, int); recomp3ds_synth_hook(rdram, ctx, 7); }
#endif
"""
# 3DS: n_alAudioFrame has run the players' handlers (their n_alSyn* calls are
# what the DSP plays) and is about to build the command list: with the voices
# on the DSP, or the sound off, nothing runs the list, so rt64-3ds takes the
# frame's updates itself, the samples left to build (sp+0x4C) go to 0 and the
# list's end (sp+0x34) moves past the one command it writes (rt64-3ds
# dsp_synth.h). This build keeps both on the stack.
[[patches.hook]]
func = "n_alAudioFrame"
before_vram = 0x80739B90
text = """
#ifdef __3DS__
    { extern int recomp3ds_synth_skip_build(uint8_t*, uint32_t, int32_t, uint32_t);
      if (recomp3ds_synth_skip_build(rdram, 0, (int32_t)MEM_W(0x4C, ctx->r29), (uint32_t)MEM_W(0x34, ctx->r29))) {
          MEM_W(0x4C, ctx->r29) = 0; MEM_W(0x34, ctx->r29) = MEM_W(0x34, ctx->r29) + 8; } }
#endif
"""
